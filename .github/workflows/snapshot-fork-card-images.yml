name: Snapshot (card-images)

# Daily desktop installer built from the card-images branch and published as a
# rolling GitHub release on this fork. Adapted from snapshots-pc.yml, which
# publishes to cardforge.org over FTP and is guarded to the Card-Forge org.
#
# The schedule only fires for the copy of this file on the default branch, so
# this lives on master and checks card-images out explicitly.

on:
  workflow_dispatch:
  schedule:
    # 06:30 UTC daily. Quoted because * is special in YAML.
    - cron: '30 6 * * *'

concurrency:
  group: snapshot-card-images
  cancel-in-progress: false

env:
  SNAPSHOT_BRANCH: card-images
  SNAPSHOT_TAG: snapshot-card-images

jobs:
  build:
    if: github.repository_owner == 'autumnmyst'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SNAPSHOT_BRANCH }}

      - name: Fetch history for changelog
        # The changelog plugin diffs against the most recent forge-* tag. The
        # checkout above is shallow, so pull just enough history to reach it;
        # the build degrades to an empty CHANGES.txt if no tag is found.
        run: |
          TAG=$(gh api repos/${{ github.repository }}/tags \
            --jq '[.[] | select(.name | startswith("forge-"))][0]')
          TAG_SHA=$(echo "$TAG" | jq -r '.commit.sha')
          TAG_NAME=$(echo "$TAG" | jq -r '.name')
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "null" ]; then
            TAG_DATE=$(gh api "repos/${{ github.repository }}/commits/$TAG_SHA" \
              --jq '.commit.committer.date')
            git fetch --shallow-since="$TAG_DATE" origin "$SNAPSHOT_BRANCH"
            git fetch origin tag "$TAG_NAME"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install virtual framebuffer to allow running GUI on a headless server
        run: command -v Xvfb >/dev/null 2>&1 || { sudo apt update && sudo apt install -y xvfb; }

      - name: Configure Git user
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      # Tests are skipped here on purpose: test-build.yaml already runs the full
      # suite on every push, so the snapshot only needs to package.
      - name: Build installer
        run: |
          export DISPLAY=":1"
          Xvfb :1 -screen 0 800x600x8 &
          mvn -U -B clean -P windows-linux install -T 1C -DskipTests

      - name: Describe the build
        id: info
        # github.sha is the commit the workflow file came from (master on a
        # scheduled run), not the branch that was checked out and built.
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Collect release assets
        run: |
          set -eu
          ls -la forge-installer/target/ || true
          mkdir -p release
          # -print -quit rather than a pipe to head, which can SIGPIPE find.
          JAR=$(find forge-installer/target -maxdepth 1 -name 'forge-installer-*.jar' -print -quit)
          BZ2=$(find forge-installer/target -maxdepth 1 -name 'forge-installer-*.tar.bz2' -print -quit)
          if [ -z "$JAR" ] || [ -z "$BZ2" ]; then
            echo "::error::installer artifacts missing"
            exit 1
          fi
          # Fixed asset names so each run replaces the previous day's upload
          # rather than accumulating hundreds of megabytes per day.
          cp "$JAR" release/forge-installer-card-images.jar
          cp "$BZ2" release/forge-installer-card-images.tar.bz2
          # Must exist unconditionally or the upload step fails on a missing file.
          if [ -f forge-gui-desktop/target/classes/build.txt ]; then
            cp forge-gui-desktop/target/classes/build.txt release/build.txt
          else
            echo "unknown" > release/build.txt
          fi
          ls -la release/

      - name: Publish rolling snapshot release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SNAPSHOT_TAG }}
          target_commitish: ${{ env.SNAPSHOT_BRANCH }}
          name: card-images snapshot ${{ steps.info.outputs.date }}
          prerelease: true
          make_latest: false
          body: |
            Desktop installer built from `${{ env.SNAPSHOT_BRANCH }}`.

            - Commit: `${{ steps.info.outputs.short }}` (${{ steps.info.outputs.sha }})
            - Built: ${{ steps.info.outputs.date }}
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Install with `java -jar forge-installer-card-images.jar`, or unpack
            the `.tar.bz2` and run `forge.sh` / `forge.cmd`.

            This is an unofficial personal build, not a Card-Forge release.
          files: |
            release/forge-installer-card-images.jar
            release/forge-installer-card-images.tar.bz2
            release/build.txt
